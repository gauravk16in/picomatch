[package]
name = "pmx-cli"
description = "pmx binary + shared op-dispatch library; --serve subprocess adapter for the JS parity harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false  # path-only workspace deps; not yet published to crates.io

[lib]
name = "pmx_cli"
path = "src/lib.rs"

[[bin]]
name = "pmx"
path = "src/main.rs"

[dependencies]
pmx-core = { path = "../pmx-core" }
pmx-exec = { path = "../pmx-exec" }
serde_json = "1"
