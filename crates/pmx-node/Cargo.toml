[package]
name = "pmx-node"
description = "NAPI-rs bridge exposing pmx ops to Node.js. Test adapter only; never referenced by pmx-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false  # NAPI test adapter; not intended for crates.io

[lib]
crate-type = ["cdylib"]

[dependencies]
pmx-core = { path = "../pmx-core" }
pmx-cli = { path = "../pmx-cli" }
napi = "2"
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
