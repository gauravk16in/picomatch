[package]
name = "pmx-core"
description = "Pure-Rust port of picomatch v4.0.5 (bug-for-bug parity). Core compiler: pattern -> JS-RegExp source string."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[features]
default = ["validate-regex"]
validate-regex = ["regress"]

[dependencies]
thiserror = "2"
regress = { version = "0.11", features = ["utf16"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
