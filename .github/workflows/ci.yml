name: CI

on:
  push:
    branches: [rust-port, review-remediation]
  pull_request:
    branches: [rust-port]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  adapter-parity:
    name: Adapter parity (Node.js)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Main (JavaScript reference)
        uses: actions/checkout@v4
        with:
          repository: micromatch/picomatch
          ref: '4.0.5'
          path: Main
      - name: Create reference path symlinks for fixtures
        run: |
          # fixtures/verify-c0..c2 require ../../Main
          # fixtures/verify-c3 requires ../../picomatch
          # fixtures/verify-c4..c9 require ../../picomatch-original
          # In CI, __dirname is <workspace>/fixtures/, so ../../ resolves
          # to the parent of the workspace. Create directories there pointing
          # back to the Main checkout inside the workspace.
          mkdir -p "$GITHUB_WORKSPACE/.."
          ln -sf "$GITHUB_WORKSPACE/Main" "$GITHUB_WORKSPACE/../Main"
          ln -sf "$GITHUB_WORKSPACE/Main" "$GITHUB_WORKSPACE/../picomatch"
          ln -sf "$GITHUB_WORKSPACE/Main" "$GITHUB_WORKSPACE/../picomatch-original"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pmx-cli
        run: cargo build --release -p pmx-cli
      - name: Build scanbench example
        run: cargo build --release --example scanbench
      - name: Install Node dependencies
        run: cd adapter && npm ci || npm install
      - name: Run corpus verification
        run: |
          for f in fixtures/verify-c*.js; do
            echo "--- $f ---"
            node "$f"
          done
      - name: Run benchmark canaries
        run: node benchmarks/bench-canaries.js